[project]
name = "baitlock-server"
version = "1.0.0"
description = "Baitlock — Real-time phishing and fraud detection backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.0",
    # Database
    "sqlalchemy>=2.0.0",
    # Config
    "pydantic-settings>=2.0.0",
    # AI dependencies
    "jellyfish>=1.2.1",
    "tldextract>=5.1.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    # Auth
    "pyjwt>=2.8.0",
    "google-auth>=2.27.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
]
